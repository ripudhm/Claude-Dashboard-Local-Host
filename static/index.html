<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAF Dashboard</title>
<style>
  :root {
    --bg: #10151C;
    --surface: #161C25;
    --border: #262E3A;
    --text: #E7E5DF;
    --muted: #7C8798;
    --accent: #4FB286;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  header .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  header .last-checked-line {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  #refresh-btn {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
  }

  #refresh-btn:hover {
    border-color: var(--accent);
  }

  #refresh-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  main {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }

  .panel-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    text-transform: lowercase;
  }

  .panel-head .meta {
    font-size: 11px;
    color: var(--muted);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }

  summary.panel-head {
    cursor: pointer;
    user-select: none;
  }

  .chevron {
    display: inline-block;
    margin-right: 6px;
    font-size: 10px;
    color: var(--muted);
    transition: transform 0.15s ease;
  }

  details[open] .chevron {
    transform: rotate(90deg);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }

  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  tbody td {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .empty {
    padding: 20px 16px;
    color: var(--muted);
    font-size: 13px;
  }

  .pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; }
  }

  .chart-panel {
    grid-column: 1 / -1;
    padding: 14px 16px 16px;
  }

  .chart-wrap {
    position: relative;
  }

  .chart-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .chart-svg:focus {
    outline: none;
  }

  .chart-grid {
    stroke: var(--border);
    stroke-width: 1;
  }

  .chart-tick {
    font-size: 10.5px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    fill: var(--muted);
  }

  .chart-line {
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .chart-dot-ring {
    fill: var(--surface);
  }

  .chart-dot {
    fill: var(--accent);
  }

  .chart-end-label {
    fill: var(--text);
    font-size: 12px;
    font-weight: 600;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }

  .chart-crosshair {
    stroke: var(--muted);
    stroke-width: 1;
    opacity: 0;
    pointer-events: none;
  }

  .chart-tooltip {
    position: absolute;
    transform: translate(-50%, -100%) translateY(-10px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
  }

  .chart-tooltip-date {
    color: var(--muted);
    margin-right: 8px;
  }

  .chart-tooltip-value {
    color: var(--text);
    font-weight: 600;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1><span class="pulse"></span>LAF Dashboard</h1>
    <button id="refresh-btn">Refresh</button>
  </div>
  <p>latest activity across configured telegram groups</p>
  <p class="last-checked-line">last checked: <span id="last-checked">&ndash;</span></p>
</header>

<main id="panels"></main>

<script>
const ROW_LIMIT = 30;

async function loadGroups() {
  const res = await fetch('/api/groups');
  return res.json();
}

async function loadRows(table) {
  const res = await fetch(`/api/${table}?limit=${ROW_LIMIT}`);
  if (!res.ok) return [];
  return res.json();
}

async function loadStatus() {
  const res = await fetch('/api/status');
  if (!res.ok) return null;
  return res.json();
}

function formatTimestamp(ts) {
  if (!ts) return '';
  const d = new Date(ts.replace(' ', 'T') + 'Z');
  return d.toLocaleString([], {
    month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function renderPanel(group, rows) {
  const cols = [...group.columns, ...(group.show_sender === false ? [] : ['sender']), 'timestamp'];

  const headCells = cols.map(c => `<th>${c === 'timestamp' ? 'date & time' : c}</th>`).join('');

  const bodyRows = rows.length
    ? rows.map(row => {
        const cells = cols.map(c =>
          `<td title="${row[c] ?? ''}">${c === 'timestamp' ? formatTimestamp(row[c]) : (row[c] ?? '')}</td>`
        ).join('');
        return `<tr>${cells}</tr>`;
      }).join('')
    : '';

  const body = rows.length
    ? `<table><thead><tr>${headCells}</tr></thead><tbody>${bodyRows}</tbody></table>`
    : `<div class="empty">no messages yet</div>`;

  return `
    <details class="panel" data-table="${group.table}">
      <summary class="panel-head">
        <h2><span class="chevron">&#9656;</span>${group.table}</h2>
        <span class="meta">${rows.length} shown</span>
      </summary>
      ${body}
    </details>
  `;
}

function toChartPoints(rows, field) {
  return rows
    .map(r => ({ t: new Date(r.timestamp.replace(' ', 'T') + 'Z'), v: parseFloat(r[field]) }))
    .filter(p => !isNaN(p.v) && !isNaN(p.t.getTime()));
}

function chartGeometry(points) {
  const W = 720, H = 240;
  const padL = 34, padR = 20, padT = 16, padB = 26;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xs = points.map(p => p.t.getTime());
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const xSpan = Math.max(xMax - xMin, 1);
  const yMin = 0, yMax = 100;
  return {
    W, H, padL, padR, padT, padB, plotW, plotH,
    xFor: t => padL + ((t - xMin) / xSpan) * plotW,
    yFor: v => padT + (1 - (v - yMin) / (yMax - yMin)) * plotH,
  };
}

function renderChart(rows, field, label, chartId) {
  const points = toChartPoints(rows, field);

  if (points.length < 2) {
    return `
      <section class="panel chart-panel">
        <div class="panel-head"><h2>${label} over time</h2></div>
        <div class="empty">not enough data yet</div>
      </section>`;
  }

  const { W, H, padL, padR, padT, padB, xFor, yFor } = chartGeometry(points);

  const yTicks = [0, 25, 50, 75, 100];
  const gridLines = yTicks.map(t => {
    const y = yFor(t).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" class="chart-grid" />
      <text x="${padL - 6}" y="${y}" class="chart-tick" text-anchor="end" dominant-baseline="middle">${t}</text>`;
  }).join('');

  const linePath = points.map((p, i) =>
    `${i === 0 ? 'M' : 'L'} ${xFor(p.t.getTime()).toFixed(1)} ${yFor(p.v).toFixed(1)}`
  ).join(' ');

  const dots = points.map(p => {
    const x = xFor(p.t.getTime()).toFixed(1);
    const y = yFor(p.v).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="6" class="chart-dot-ring" />
      <circle cx="${x}" cy="${y}" r="4" class="chart-dot" />`;
  }).join('');

  const tickIdxs = points.length <= 4
    ? points.map((_, i) => i)
    : [0, Math.floor((points.length - 1) / 2), points.length - 1];
  const xTicks = tickIdxs.map((i, idx) => {
    const p = points[i];
    const x = xFor(p.t.getTime()).toFixed(1);
    const anchor = idx === 0 ? 'start' : idx === tickIdxs.length - 1 ? 'end' : 'middle';
    const tickLabel = p.t.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return `<text x="${x}" y="${H - padB + 16}" class="chart-tick" text-anchor="${anchor}">${tickLabel}</text>`;
  }).join('');

  const last = points[points.length - 1];
  const lastX = xFor(last.t.getTime()).toFixed(1);
  const lastY = yFor(last.v).toFixed(1);

  return `
    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>${label} over time</h2>
        <span class="meta">${points.length} points</span>
      </div>
      <div class="chart-wrap" id="${chartId}-wrap">
        <svg viewBox="0 0 ${W} ${H}" class="chart-svg" tabindex="0"
             role="img" aria-label="${label} over time, most recent value ${last.v.toFixed(2)} percent">
          ${gridLines}
          <line class="chart-crosshair" id="${chartId}-crosshair" x1="0" y1="${padT}" x2="0" y2="${H - padB}" />
          <path d="${linePath}" class="chart-line" fill="none" />
          ${dots}
          <text x="${lastX}" y="${Math.max(parseFloat(lastY) - 10, 10)}" class="chart-end-label" text-anchor="end">${last.v.toFixed(2)}%</text>
          ${xTicks}
        </svg>
        <div class="chart-tooltip" id="${chartId}-tooltip" hidden>
          <span class="chart-tooltip-date"></span><span class="chart-tooltip-value"></span>
        </div>
      </div>
    </section>`;
}

function initChartInteraction(chartId, points) {
  const wrap = document.getElementById(`${chartId}-wrap`);
  if (!wrap) return;
  const svg = wrap.querySelector('svg');
  const crosshair = document.getElementById(`${chartId}-crosshair`);
  const tooltip = document.getElementById(`${chartId}-tooltip`);
  const geo = chartGeometry(points);
  let focusIdx = points.length - 1;

  function nearestPoint(clientX) {
    const rect = svg.getBoundingClientRect();
    const svgX = (clientX - rect.left) * (geo.W / rect.width);
    let closest = points[0], closestDist = Infinity, closestIdx = 0;
    points.forEach((p, i) => {
      const d = Math.abs(geo.xFor(p.t.getTime()) - svgX);
      if (d < closestDist) { closestDist = d; closest = p; closestIdx = i; }
    });
    focusIdx = closestIdx;
    return closest;
  }

  function showFor(p) {
    const x = geo.xFor(p.t.getTime());
    crosshair.setAttribute('x1', x.toFixed(1));
    crosshair.setAttribute('x2', x.toFixed(1));
    crosshair.style.opacity = '1';

    const wrapRect = wrap.getBoundingClientRect();
    const svgRect = svg.getBoundingClientRect();
    const scale = svgRect.width / geo.W;

    tooltip.style.left = `${svgRect.left - wrapRect.left + x * scale}px`;
    tooltip.style.top = `${svgRect.top - wrapRect.top + geo.yFor(p.v) * scale}px`;
    tooltip.querySelector('.chart-tooltip-date').textContent =
      p.t.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    tooltip.querySelector('.chart-tooltip-value').textContent = `${p.v.toFixed(2)}%`;
    tooltip.hidden = false;
  }

  function hide() {
    crosshair.style.opacity = '0';
    tooltip.hidden = true;
  }

  svg.addEventListener('pointermove', e => showFor(nearestPoint(e.clientX)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => showFor(points[focusIdx]));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') {
      focusIdx = Math.max(0, focusIdx - 1);
      showFor(points[focusIdx]);
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      focusIdx = Math.min(points.length - 1, focusIdx + 1);
      showFor(points[focusIdx]);
      e.preventDefault();
    }
  });
}

// Groups whose columns include this field get a line chart of it over time.
const CHARTED_FIELDS = [
  { field: 'atta%', label: 'atta %', id: 'chart-atta-pct' },
];

let lastKnownSync = null;

async function refresh() {
  const [groups, status] = await Promise.all([loadGroups(), loadStatus()]);
  const panelsEl = document.getElementById('panels');
  const rowsByTable = {};

  const html = await Promise.all(groups.map(async g => {
    const rows = await loadRows(g.table);
    rowsByTable[g.table] = rows;
    return renderPanel(g, rows);
  }));

  const charts = [];
  groups.forEach(g => {
    CHARTED_FIELDS.forEach(spec => {
      if (g.columns.includes(spec.field)) {
        charts.push({ ...spec, rows: rowsByTable[g.table] });
      }
    });
  });

  const openTables = new Set(
    Array.from(panelsEl.querySelectorAll('details.panel[open]')).map(d => d.dataset.table)
  );

  panelsEl.innerHTML = html.join('') + charts.map(c => renderChart(c.rows, c.field, c.label, c.id)).join('');

  panelsEl.querySelectorAll('details.panel').forEach(d => {
    if (openTables.has(d.dataset.table)) d.open = true;
  });

  charts.forEach(c => {
    const points = toChartPoints(c.rows, c.field);
    if (points.length >= 2) initChartInteraction(c.id, points);
  });

  lastKnownSync = status ? status.last_synced_at : null;
  const lastCheckedEl = document.getElementById('last-checked');
  lastCheckedEl.textContent = lastKnownSync ? formatTimestamp(lastKnownSync) : 'never';
}

// Lightweight poll: only pulls the (tiny) sync status, and only reloads the
// full data if the backend's 6-hourly check actually found something new.
const STATUS_POLL_MS = 60 * 1000;

async function pollForUpdates() {
  const status = await loadStatus();
  if (status && status.last_synced_at && status.last_synced_at !== lastKnownSync) {
    await refresh();
  }
}

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  refreshBtn.textContent = 'Refreshing…';
  await fetch('/api/sync', { method: 'POST' });
  await refresh();
  refreshBtn.textContent = 'Refresh';
  refreshBtn.disabled = false;
});

refresh();
setInterval(pollForUpdates, STATUS_POLL_MS);
</script>

</body>
</html>
