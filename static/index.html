<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Feed</title>
<style>
  :root {
    --bg: #10151C;
    --surface: #161C25;
    --border: #262E3A;
    --text: #E7E5DF;
    --muted: #7C8798;
    --accent: #4FB286;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  main {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }

  .panel-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    text-transform: lowercase;
  }

  .panel-head .meta {
    font-size: 11px;
    color: var(--muted);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }

  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  tbody td {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .empty {
    padding: 20px 16px;
    color: var(--muted);
    font-size: 13px;
  }

  .pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="pulse"></span>group feed</h1>
  <p>latest activity across configured telegram groups</p>
</header>

<main id="panels"></main>

<script>
const REFRESH_MS = 10000;
const ROW_LIMIT = 15;

async function loadGroups() {
  const res = await fetch('/api/groups');
  return res.json();
}

async function loadRows(table) {
  const res = await fetch(`/api/${table}?limit=${ROW_LIMIT}`);
  if (!res.ok) return [];
  return res.json();
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts.replace(' ', 'T') + 'Z');
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderPanel(group, rows) {
  const cols = [...group.columns, 'sender', 'timestamp'];

  const headCells = cols.map(c => `<th>${c}</th>`).join('');

  const bodyRows = rows.length
    ? rows.map(row => {
        const cells = cols.map(c =>
          `<td title="${row[c] ?? ''}">${c === 'timestamp' ? formatTime(row[c]) : (row[c] ?? '')}</td>`
        ).join('');
        return `<tr>${cells}</tr>`;
      }).join('')
    : '';

  const body = rows.length
    ? `<table><thead><tr>${headCells}</tr></thead><tbody>${bodyRows}</tbody></table>`
    : `<div class="empty">no messages yet</div>`;

  return `
    <section class="panel">
      <div class="panel-head">
        <h2>${group.table}</h2>
        <span class="meta">${rows.length} shown</span>
      </div>
      ${body}
    </section>
  `;
}

async function refresh() {
  const groups = await loadGroups();
  const panelsEl = document.getElementById('panels');

  const html = await Promise.all(groups.map(async g => {
    const rows = await loadRows(g.table);
    return renderPanel(g, rows);
  }));

  panelsEl.innerHTML = html.join('');
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>

</body>
</html>
